name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VRVideoPlayer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRVideoPlayer-APK
          path: VRVideoPlayer.apk
          retention-days: 30

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-apk
          name: VR Video Player v1.0 APK
          draft: false
          prerelease: false
          files: VRVideoPlayer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
