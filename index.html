<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VR / Normal Video Player</title>
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<link href="https://unpkg.com/videojs-vr/dist/videojs-vr.css" rel="stylesheet">
<link href="local-video.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial; background: #111; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* ── Top Controls Bar ── */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1e1e1e;
    padding: 8px 12px;
    border-bottom: 1px solid #2a2a2a;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .ctrl-btn {
    padding: 7px 11px; border: none; border-radius: 5px;
    color: #fff; cursor: pointer; font-weight: bold;
    font-size: 12px; white-space: nowrap; background: #cc0000;
  }
  .ctrl-btn:hover { filter: brightness(1.3); }

  #prevBtn, #nextBtn        { background: #444; }
  #skipBackBtn, #skipFwdBtn { background: #333; }
  #modeBtn                  { background: #0055bb; }
  #loadBtn                  { background: #556; }
  #applyResBtn              { background: #775500; }
  #fitResBtn                { background: #334455; }
  #rotateBtn               { background: #553388; }

  .divider { width: 1px; height: 26px; background: #3a3a3a; flex-shrink: 0; }

  /* Size inputs */
  .size-group { display: flex; align-items: center; gap: 4px; }
  .size-group label { font-size: 11px; color: #aaa; white-space: nowrap; }
  .size-input {
    width: 58px; padding: 6px 4px; border-radius: 5px;
    border: 1px solid #444; background: #111; color: #fff;
    font-size: 12px; text-align: center; outline: none;
  }
  .size-input:focus { border-color: #0088ff; }
  .size-sep { color: #555; font-weight: bold; }

  /* Resolution badge */
  #resBadge {
    font-size: 11px; color: #0af;
    background: #0a1a2a; border: 1px solid #0af;
    border-radius: 4px; padding: 3px 7px;
    white-space: nowrap;
  }

  /* Zoom */
  .zoom-group { display: flex; align-items: center; gap: 4px; }
  .zoom-group span { font-size: 11px; color: #aaa; white-space: nowrap; min-width: 50px; }
  .zoom-btn { background: #1a5c30; padding: 6px 10px; }

  /* ── Main Area ── */
  .main-area {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Player Section ── */
  .player-section {
    flex: 1; display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
    padding: 10px;
  }

  #video-container {
    position: relative; background: #000;
    border-radius: 8px; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    /* Size controlled by JS */
    width: 100%; height: 100%;
    max-width: 100%; max-height: 100%;
    transition: width 0.2s, height 0.2s;
  }

  .video-js { width: 100% !important; height: 100% !important; }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px; min-width: 240px;
    background: #1a1a1a; border-left: 1px solid #333;
    display: flex; flex-direction: column; overflow: hidden;
    flex-shrink: 0;
  }
  .search-bar {
    width: 100%; padding: 9px 10px; background: #111; color: #fff;
    border: none; border-bottom: 1px solid #333; font-size: 13px; outline: none;
  }
  #playlist { flex: 1; overflow-y: auto; padding: 8px; }

  .video-item {
    display: flex; flex-direction: column; margin-bottom: 12px;
    cursor: pointer; padding: 8px; border-radius: 8px;
    background: #111; border: 1px solid #222; transition: 0.2s;
  }
  .video-item:hover { background: #232323; border-color: #555; }
  .video-item.active { border: 2px solid #cc0000; }
  .video-item video {
    width: 100%; height: 140px; object-fit: cover;
    border-radius: 5px; background: #000; pointer-events: none;
  }
  .video-item span {
    display: block; margin-top: 5px; font-size: 11px;
    color: #bbb; word-break: break-word; line-height: 1.3;
  }

  /* ── Sidebar Tabs ── */
  .sidebar-tabs {
    display: flex; flex-shrink: 0;
    border-bottom: 1px solid #333;
  }
  .sidebar-tab {
    flex: 1; padding: 8px 4px; background: #111; color: #888;
    border: none; cursor: pointer; font-size: 12px; font-weight: bold;
    border-bottom: 2px solid transparent; transition: 0.2s;
  }
  .sidebar-tab.active { color: #fff; background: #1a1a1a; border-bottom-color: #cc0000; }
  .sidebar-tab:hover:not(.active) { color: #ccc; background: #181818; }

  /* ── Server Panel ── */
  .server-panel {
    display: none; flex-direction: column; flex: 1; overflow: hidden;
  }
  .server-panel.visible { display: flex; }

  .server-config {
    padding: 8px; background: #111; border-bottom: 1px solid #2a2a2a;
    display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
  }
  .server-config-row { display: flex; gap: 6px; align-items: center; }
  .server-config label { font-size: 11px; color: #888; white-space: nowrap; }
  .server-input {
    flex: 1; padding: 6px 8px; background: #1e1e1e; color: #fff;
    border: 1px solid #444; border-radius: 5px; font-size: 12px; outline: none;
  }
  .server-input:focus { border-color: #0088ff; }
  .server-num-input {
    width: 52px; padding: 6px 4px; background: #1e1e1e; color: #fff;
    border: 1px solid #444; border-radius: 5px; font-size: 12px;
    text-align: center; outline: none;
  }
  .server-num-input:focus { border-color: #0088ff; }
  .load-server-btn {
    padding: 6px 12px; background: #cc0000; color: #fff;
    border: none; border-radius: 5px; cursor: pointer;
    font-size: 12px; font-weight: bold; white-space: nowrap;
  }
  .load-server-btn:hover { filter: brightness(1.3); }

  #serverList { flex: 1; overflow-y: auto; padding: 8px; }

  .server-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 7px; margin-bottom: 6px;
    background: #111; border: 1px solid #222; cursor: pointer; transition: 0.2s;
  }
  .server-item:hover { background: #232323; border-color: #555; }
  .server-item.active { border: 2px solid #cc0000; background: #1a0000; }
  .server-item .s-num {
    width: 26px; height: 26px; border-radius: 50%; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #aaa; font-weight: bold; flex-shrink: 0;
  }
  .server-item.active .s-num { background: #cc0000; color: #fff; }
  .server-item .s-name { font-size: 12px; color: #ccc; word-break: break-all; }
  .server-status {
    font-size: 11px; color: #666; text-align: center; padding: 16px 8px;
  }

  /* ── Mobile & Responsive Player Overlay Styles ── */
  .player-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Transparent gesture capture layer behind controls */
  .gesture-area {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: transparent;
    touch-action: none;
  }

  /* Double-tap ripple indicators */
  .gesture-ripple {
    position: absolute;
    top: 50%;
    transform: translateY(-50%) scale(0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .gesture-ripple.active {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }
  .ripple-left { left: 12%; }
  .ripple-right { right: 12%; }
  .ripple-center { left: 50%; transform: translate(-50%, -50%) scale(0.7); width: 70px; height: 70px; }
  .ripple-center.active { transform: translate(-50%, -50%) scale(1); }
  .ripple-icon { font-size: 24px; line-height: 1; }
  .ripple-text { font-size: 11px; font-weight: bold; margin-top: 3px; color: #ff4444; }

  /* OSD Brightness / Volume */
  .osd-bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 140px;
    background: rgba(18, 18, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    z-index: 25;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .osd-bar.active { opacity: 1; }
  .osd-left { left: 18px; }
  .osd-right { right: 18px; }
  .osd-icon { font-size: 16px; color: #fff; }
  .osd-track {
    width: 6px;
    flex: 1;
    margin: 8px 0;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .osd-fill {
    width: 100%;
    background: #0088ff;
    border-radius: 3px;
    transition: height 0.05s ease;
    height: 50%;
  }
  .osd-left .osd-fill { background: #ffaa00; }
  .osd-text { font-size: 10px; font-weight: bold; color: #ddd; }

  /* Mobile Controls Overlay */
  .mobile-controls-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.15) 25%, rgba(0,0,0,0.15) 75%, rgba(0,0,0,0.85) 100%);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.28s ease, visibility 0.28s ease;
    z-index: 10;
  }
  .mobile-controls-overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  /* Overlay Top Bar */
  .m-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    gap: 8px;
    pointer-events: auto;
  }
  .m-video-title-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 0 4px;
  }
  .m-video-title {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .m-res-badge {
    font-size: 10px;
    color: #0af;
    opacity: 0.9;
  }

  /* Center Controls */
  .m-center-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: auto;
  }
  .m-btn {
    border: none;
    background: transparent;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .m-btn:active { transform: scale(0.92); }
  .m-btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .m-btn-center {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .m-btn-play-pause {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(204, 0, 0, 0.9);
    box-shadow: 0 4px 14px rgba(204, 0, 0, 0.4);
  }
  .m-btn-play-pause:hover { filter: brightness(1.2); }
  .m-btn-sm {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: transparent;
  }
  .m-btn-chip {
    padding: 6px 10px;
    min-width: 44px;
    height: 34px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.15);
    font-size: 12px;
    font-weight: bold;
    color: #fff;
  }

  /* Bottom Bar */
  .m-bottom-bar {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 14px 12px 14px;
    pointer-events: auto;
  }
  .m-progress-container {
    width: 100%;
    height: 32px;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
    touch-action: none;
  }
  .m-progress-track {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 3px;
    position: relative;
    transition: height 0.15s ease;
  }
  .m-progress-container:hover .m-progress-track,
  .m-progress-container.scrubbing .m-progress-track {
    height: 8px;
  }
  .m-progress-buffer {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: rgba(255, 255, 255, 0.45);
    border-radius: 3px;
    width: 0%;
  }
  .m-progress-played {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: #cc0000;
    border-radius: 3px;
    width: 0%;
  }
  .m-progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #cc0000;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.6);
    transition: transform 0.15s ease;
  }
  .m-progress-container:hover .m-progress-thumb,
  .m-progress-container.scrubbing .m-progress-thumb {
    transform: translate(-50%, -50%) scale(1.3);
  }
  .m-seek-tooltip {
    position: absolute;
    top: -28px;
    left: 0%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    display: none;
    pointer-events: none;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  /* Bottom Row */
  .m-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .m-time-display {
    font-size: 12px;
    font-weight: 500;
    color: #ddd;
    font-variant-numeric: tabular-nums;
  }
  .m-time-sep { margin: 0 3px; color: #777; }
  .m-bottom-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Drawer Backdrop */
  .drawer-backdrop, .settings-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 998;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .drawer-backdrop.active, .settings-backdrop.active {
    opacity: 1;
    visibility: visible;
  }

  /* Mobile Drawer Header & Actions (hidden on desktop) */
  .mobile-drawer-header {
    display: none;
  }
  .mobile-local-actions {
    display: none;
  }

  /* Settings Modal / Bottom Sheet */
  .settings-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    pointer-events: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .settings-modal.open {
    pointer-events: auto;
  }
  .settings-sheet {
    position: relative;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    background: #18181b;
    border-radius: 20px 20px 0 0;
    border: 1px solid #333;
    border-bottom: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 2001;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.8);
  }
  .settings-modal.open .settings-sheet {
    transform: translateY(0);
  }
  .settings-handle {
    width: 36px;
    height: 4px;
    background: #444;
    border-radius: 2px;
    margin: 8px auto 0 auto;
  }
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid #2a2a2a;
  }
  .settings-title {
    font-size: 15px;
    font-weight: bold;
    color: #fff;
  }
  .settings-close-btn {
    background: #2a2a2a;
    border: none;
    color: #ccc;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .settings-body {
    overflow-y: auto;
    padding: 14px 18px 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .setting-row {
    display: flex;
    gap: 10px;
  }
  .setting-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .setting-label {
    font-size: 12px;
    color: #aaa;
    font-weight: 600;
  }
  .setting-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .setting-chip {
    padding: 6px 12px;
    background: #242428;
    border: 1px solid #333;
    color: #ddd;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.15s;
    font-weight: 500;
  }
  .setting-chip:hover {
    background: #333;
    color: #fff;
  }
  .setting-chip.active {
    background: #cc0000;
    color: #fff;
    border-color: #ff3333;
  }
  .setting-toggle-btn {
    width: 100%;
    padding: 9px 12px;
    background: #242428;
    border: 1px solid #3a3a40;
    color: #fff;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .setting-btn-group {
    display: flex;
    gap: 4px;
  }
  .setting-mini-btn {
    flex: 1;
    padding: 7px;
    background: #1a5c30;
    border: none;
    border-radius: 5px;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .setting-action-btn {
    width: 100%;
    padding: 10px;
    background: #0055bb;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .setting-info {
    padding: 8px 12px;
    background: #121214;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    font-size: 11px;
    color: #888;
  }

  /* ── Responsive Mobile Rules (Phones & Tablets <= 768px) ── */
  @media (max-width: 768px) {
    /* Hide desktop toolbar */
    .controls-bar {
      display: none !important;
    }

    /* Main Area fills entire screen */
    .main-area {
      flex: 1;
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Video section uses 100% of available screen */
    .player-section {
      width: 100vw !important;
      height: 100% !important;
      padding: 0 !important;
      position: relative;
    }

    #video-container {
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
    }

    /* Hide Video.js default controls on mobile so custom controls take over */
    .video-js .vjs-control-bar {
      display: none !important;
    }
    .video-js .vjs-big-play-button {
      display: none !important;
    }

    /* Sidebar converts into a smooth slide-in Drawer */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 86%;
      max-width: 360px;
      z-index: 1000;
      background: #18181b;
      box-shadow: -6px 0 25px rgba(0, 0, 0, 0.8);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.open {
      transform: translateX(0);
    }

    .mobile-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #121214;
      border-bottom: 1px solid #2a2a2a;
    }
    .mobile-drawer-title {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }
    .drawer-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #27272a;
      border: none;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-local-actions {
      display: block;
      padding: 8px 10px;
      background: #141416;

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/videojs-vr/dist/videojs-vr.min.js"></script>
<script>

let player       = null;
let isVR         = true;
let files        = [];
let currentIndex = 0;
let currentUrl   = null;
let autoMode     = true; // true = auto detect video resolution
let loop1Only    = true; // true = loop 1 video on completion

let zoomLevel    = 1.0;
const ZOOM_STEP  = 0.1;
const ZOOM_MIN   = 0.3;
const ZOOM_MAX   = 3.0;

let rotationDeg  = 0; // 0, 90, 180, 270

const videoContainer = document.getElementById("video-container");
const playlistEl     = document.getElementById("playlist");
const folderPicker   = document.getElementById("folderPicker");
const modeBtn        = document.getElementById("modeBtn");
const zoomLabelEl    = document.getElementById("zoomLabel");
const resBadge       = document.getElementById("resBadge");
const inputW         = document.getElementById("inputW");
const inputH         = document.getElementById("inputH");


// ══════════════════════════════
//  AUTO RESOLUTION DETECTION
//  Reads actual video width/height and resizes container
// ══════════════════════════════
function autoDetectAndResize() {
  if (!autoMode) return;

  const vid = videoContainer.querySelector("video");
  if (!vid) return;

  const checkRes = () => {
    const vw = vid.videoWidth;
    const vh = vid.videoHeight;
    if (!vw || !vh) return; // not loaded yet

    // Update badge
    resBadge.textContent = `📐 ${vw} × ${vh}`;
    inputW.value = vw;
    inputH.value = vh;
    const mRes = document.getElementById("mobileResBadge");
    if (mRes) mRes.textContent = `📐 ${vw} × ${vh}`;
    const sRes = document.getElementById("settingsResInfo");
    if (sRes) sRes.textContent = `Resolution: ${vw} × ${vh}`;

    // Fit inside available player area keeping aspect ratio
    const section  = document.querySelector(".player-section");
    const maxW = section.clientWidth  - 20;
    const maxH = section.clientHeight - 20;

    const ratio = vw / vh;
    let fitW = maxW;
    let fitH = fitW / ratio;

    if (fitH > maxH) {
      fitH = maxH;
      fitW = fitH * ratio;
    }

    videoContainer.style.width     = Math.floor(fitW) + "px";
    videoContainer.style.height    = Math.floor(fitH) + "px";
    videoContainer.style.maxWidth  = "100%";
    videoContainer.style.maxHeight = "100%";
  };

  // Try immediately, then on loadedmetadata
  if (vid.readyState >= 1) {
    checkRes();
  }
  vid.addEventListener("loadedmetadata", checkRes, { once: true });
}


// ══════════════════════════════
//  PLAYER
// ══════════════════════════════
function getVideoMime(url, file) {
  // If we have the actual File object, trust its name over the blob URL
  if (file) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.mov')) return 'video/mp4'; // force MP4 container for browser compat
    if (name.endsWith('.mp4')) return 'video/mp4';
    if (name.endsWith('.webm')) return 'video/webm';
    if (name.endsWith('.ogg')) return 'video/ogg';
    if (name.endsWith('.m4v')) return 'video/mp4';
    if (name.endsWith('.xyz')) return 'video/mp4';
    if (file.type && file.type !== 'video/quicktime') return file.type;
    // For .mov / video/quicktime, try mp4 — modern Chrome can play many .mov files
    if (file.type === 'video/quicktime') return 'video/mp4';
  }
  // Fallback: parse extension from URL
  try {
    const ext = (new URL(url, window.location.href).pathname.split('.').pop() || '').toLowerCase();
    switch (ext) {
      case 'mp4': return 'video/mp4';
      case 'webm': return 'video/webm';
      case 'ogg': return 'video/ogg';
      case 'mov': return 'video/mp4'; // treat .mov as mp4 for browser
      case 'm4v': return 'video/mp4';
      case 'xyz': return 'video/mp4';
      default: return 'video/mp4'; // safe default
    }
  } catch(e) {
    return 'video/mp4';
  }
}

function initPlayer(url, time = 0) {
  if (player) { player.dispose(); player = null; }

  videoContainer.innerHTML = `
    <video id="player" class="video-js vjs-default-skin vjs-big-play-centered"
      controls crossorigin="anonymous" playsinline></video>`;

  player = videojs("player", {
    playbackRates: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4]
  });

  player.on('ratechange', () => {
    const rate = player.playbackRate();
    const select = document.getElementById("speedSelect");
    if (select && rate) {
      if (![...select.options].some(opt => opt.value == rate)) {
        select.add(new Option(rate + "x", rate));
      }
      select.value = rate;
    }
  });

  if (isVR) {
    try {
      player.vr({ projection: "360", motionControls: true });
    } catch (error) {
      console.warn('VR plugin not available:', error);
    }
    modeBtn.textContent = "🔄 Normal Mode";
  } else {
    modeBtn.textContent = "🔄 VR 360° Mode";
  }

  if (url) {
    const type = getVideoMime(url);
    player.src(type ? { src: url, type } : { src: url });
    player.ready(() => {
      player.currentTime(time);
      const speed = parseFloat(document.getElementById("speedSelect").value) || 1;
      player.playbackRate(speed);
      player.play().catch(() => {});
      // Auto detect after src is set
      setTimeout(autoDetectAndResize, 400);
    });
  } else {
    player.ready(() => {
      const speed = parseFloat(document.getElementById("speedSelect").value) || 1;
      player.playbackRate(speed);
    });
  }

  player.on("ended", () => {
    if (loop1Only) {
      if (files.length > 0 && files[currentIndex]) {
        playVideo(currentIndex);
      } else {
        player.currentTime(0);
        player.play().catch(() => {});
      }
    } else {
      if (files.length > 0) {
        currentIndex = (currentIndex + 1) % files.length;
        playVideo(currentIndex);
      }
    }
  });

  if (typeof bindMobilePlayer === "function") {
    bindMobilePlayer(player);
  }
}

initPlayer(null);

modeBtn.addEventListener("click", () => {
  isVR = !isVR;
  const t = player ? player.currentTime() : 0;
  initPlayer(currentUrl, t);
});


// ══════════════════════════════
//  ROTATE
// ══════════════════════════════
function applyRotation() {
  const vid = videoContainer.querySelector('video');
  const canvas = videoContainer.querySelector('canvas');
  const target = canvas || vid;
  if (!target) return;

  // For 90/270 we also need to swap width/height perception — use CSS transform
  target.style.transition = 'transform 0.3s ease';
  target.style.transform = `scale(${zoomLevel}) rotate(${rotationDeg}deg)`;

  const rotateBtn = document.getElementById('rotateBtn');
  rotateBtn.textContent = `🔃 Rotate ${rotationDeg}°`;
}

document.getElementById('rotateBtn').addEventListener('click', () => {
  rotationDeg = (rotationDeg + 90) % 360;

// ══════════════════════════════
//  ZOOM
// ══════════════════════════════
function applyZoom() {
  if (isVR && player) {
    try {
      player.vr().camera.fov = 75 / zoomLevel;
      player.vr().camera.updateProjectionMatrix();
    } catch (e) {
      const c = videoContainer.querySelector('canvas');
      if (c) c.style.transform = `scale(${zoomLevel}) rotate(${rotationDeg}deg)`;
    }
  } else {
    const v = videoContainer.querySelector('video');
    if (v) v.style.transform = `scale(${zoomLevel}) rotate(${rotationDeg}deg)`;
  }
  zoomLabelEl.textContent = `🔍 ${Math.round(zoomLevel * 100)}%`;
}

document.getElementById("zoomInBtn").addEventListener("click", () => {
  zoomLevel = Math.min(ZOOM_MAX, +(zoomLevel + ZOOM_STEP).toFixed(2));
  applyZoom();
});
document.getElementById("zoomOutBtn").addEventListener("click", () => {
  zoomLevel = Math.max(ZOOM_MIN, +(zoomLevel - ZOOM_STEP).toFixed(2));
  applyZoom();
});
document.getElementById("zoomResetBtn").addEventListener("click", () => {
  zoomLevel = 1.0; applyZoom();
});

videoContainer.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomLevel = e.deltaY < 0
    ? Math.min(ZOOM_MAX, +(zoomLevel + ZOOM_STEP).toFixed(2))
    : Math.max(ZOOM_MIN, +(zoomLevel - ZOOM_STEP).toFixed(2));
  applyZoom();
}, { passive: false });

// Load video from a URL (Telegram API getFile or direct video URL)
async function loadVideoFromUrl(rawUrl) {
  if (!rawUrl) return alert("Enter a URL first.");

  let url = rawUrl.trim();

  try {
    // If it's a Telegram getFile URL return JSON with file_path.
    if (url.includes("api.telegram.org/bot") && url.includes("getFile")) {
      const res = await fetch(url);
      const data = await res.json();
      if (!data.ok || !data.result || !data.result.file_path) {
        throw new Error("Invalid Telegram getFile response");
      }
      const filePath = data.result.file_path;
      const botToken = url.match(/bot(\d+:[A-Za-z0-9_-]+)/)?.[1];
      if (!botToken) throw new Error("Could not parse bot token from URL");
      url = `https://api.telegram.org/file/bot${botToken}/${filePath}`;
    }

    // Try to load the URL as a video.
    currentUrl = url;
    const type = getVideoMime(url);
    if (player) {
      player.src(type ? { src: url, type } : { src: url });
      player.play().catch(() => {});
      setTimeout(autoDetectAndResize, 400);
    } else {
      initPlayer(url);
    }
  } catch (err) {
    console.error(err);
    alert("Failed to load URL: " + err.message);
  }
}

function buildPlaylist() {
  playlistEl.innerHTML = "";
  files.forEach((file, i) => {
    const item = document.createElement("div");
    item.className = "video-item";

    const prev = document.createElement("video");
    prev.src   = URL.createObjectURL(file);
    prev.muted = true;
    prev.loop  = true;

    item.addEventListener("mouseenter", () => prev.play().catch(() => {}));
    item.addEventListener("mouseleave", () => { prev.pause(); prev.currentTime = 0; });

    const lbl = document.createElement("span");
    lbl.textContent = `${i + 1}. ${file.name}`;

    item.appendChild(prev);
    item.appendChild(lbl);
    playlistEl.appendChild(item);
    item.addEventListener("click", () => playVideo(i));
  });
  highlightActive(0);
}

function playVideo(i) {
  if (!files[i]) return;
  currentIndex = i;
  highlightActive(i);
  currentUrl = URL.createObjectURL(files[i]);
  const titleEl = document.getElementById("mobileVideoTitle");
  if (titleEl) titleEl.textContent = files[i].name;
  if (window.innerWidth <= 768 && typeof closeSidebarDrawer === "function") {
    closeSidebarDrawer();
  }
  if (player) {
    const type = getVideoMime(currentUrl, files[i]);
    player.src({ src: currentUrl, type });
    player.play().catch(() => {});
    // Auto detect new video resolution
    setTimeout(autoDetectAndResize, 400);
  } else {
    initPlayer(currentUrl);
  }
}

function highlightActive(i) {
  document.querySelectorAll(".video-item").forEach((el, idx) => {
    el.classList.toggle("active", idx === i);
  });
  const activeEl = document.querySelectorAll(".video-item")[i];
  if (activeEl) activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

let serverActiveIndex = -1;

function buildServerList() {
  const base   = (document.getElementById("serverUrl").value || "").replace(/\/+$/, "");
  const count  = parseInt(document.getElementById("serverCount").value) || 15;
  const start  = parseInt(document.getElementById("serverStart").value) || 1;
  const listEl = document.getElementById("serverList");

  if (!base) {
    listEl.innerHTML = '<div class="server-status">Please enter a server URL.</div>';
    return;
  }

  listEl.innerHTML = "";
  serverActiveIndex = -1;

  for (let i = start; i < start + count; i++) {
    const fileName = i + ".mp4";
    const url      = base + "/" + fileName;

    const item = document.createElement("div");
    item.className = "server-item";
    item.dataset.url   = url;
    item.dataset.index = i - start;

    item.innerHTML =
      '<div class="s-num">' + i + '</div>' +
      '<div class="s-name">' + fileName + '</div>';

    item.addEventListener("click", (function(itemEl, videoUrl) {
      return function() {
        document.querySelectorAll(".server-item").forEach(el => el.classList.remove("active"));
        itemEl.classList.add("active");

        currentUrl = videoUrl;
        const titleEl = document.getElementById("mobileVideoTitle");
        if (titleEl) titleEl.textContent = fileName;
        if (window.innerWidth <= 768 && typeof closeSidebarDrawer === "function") {
          closeSidebarDrawer();
        }
        if (player) {
          player.src({ src: videoUrl, type: "video/mp4" });
          player.play().catch(() => {});
          setTimeout(autoDetectAndResize, 400);
        } else {
          initPlayer(videoUrl);
        }
      };
    })(item, url));

    listEl.appendChild(item);
  }
}

document.getElementById("loadServerBtn").addEventListener("click", buildServerList);

let mobileControlsTimeout = null;
let currentBrightness = 1.0; // 0.2 to 2.0
let isScrubbing = false;
let osdTimeout = null;
let rippleTimeouts = {};

// Format seconds into MM:SS or HH:MM:SS
function formatTime(seconds) {
  if (isNaN(seconds) || seconds < 0) return "0:00";
  const s = Math.floor(seconds % 60);
  const m = Math.floor((seconds / 60) % 60);
  const h = Math.floor(seconds / 3600);
  const sStr = s < 10 ? "0" + s : s;
  if (h > 0) {
    const mStr = m < 10 ? "0" + m : m;
    return `${h}:${mStr}:${sStr}`;
  }
  return `${m}:${sStr}`;
}

// Show / Hide Controls Overlay
const mobileControlsOverlay = document.getElementById("mobileVideoControls");

function showMobileControls() {
  if (!mobileControlsOverlay) return;
  mobileControlsOverlay.classList.add("active");
  resetMobileControlsTimeout();
}

function hideMobileControls() {
  if (!mobileControlsOverlay) return;
  if (isScrubbing) return; // don't hide while scrubbing
  mobileControlsOverlay.classList.remove("active");
  if (mobileControlsTimeout) {
    clearTimeout(mobileControlsTimeout);
    mobileControlsTimeout = null;
  }
}

function toggleMobileControls() {
  if (!mobileControlsOverlay) return;
  if (mobileControlsOverlay.classList.contains("active")) {
    hideMobileControls();
  } else {
    showMobileControls();
  }
}

function resetMobileControlsTimeout() {
  if (mobileControlsTimeout) clearTimeout(mobileControlsTimeout);
  if (player && !player.paused()) {
    mobileControlsTimeout = setTimeout(() => {
      hideMobileControls();
    }, 3500);
  }
}

// Keep controls alive on user interaction
if (mobileControlsOverlay) {
  mobileControlsOverlay.addEventListener("click", () => {
    resetMobileControlsTimeout();
  });
  mobileControlsOverlay.addEventListener("touchstart", () => {
    resetMobileControlsTimeout();
  }, { passive: true });
}

// Update Play/Pause UI
function updatePlayPauseUI(isPlaying) {
  const playIcon = document.getElementById("mPlayIcon");
  const pauseIcon = document.getElementById("mPauseIcon");
  if (playIcon && pauseIcon) {
    playIcon.style.display = isPlaying ? "none" : "block";
    pauseIcon.style.display = isPlaying ? "block" : "none";
  }
  if (isPlaying) {
    resetMobileControlsTimeout();
  } else {
    showMobileControls();
  }
}

// Update Progress, Buffering, and Time
function updateProgressUI() {
  if (!player) return;
  const curr = player.currentTime() || 0;
  const dur = player.duration() || 0;

  const currentEl = document.getElementById("mobileTimeCurrent");
  const durationEl = document.getElementById("mobileTimeDuration");
  if (currentEl) currentEl.textContent = formatTime(curr);
  if (durationEl) durationEl.textContent = formatTime(dur);

  if (!isScrubbing) {
    const pct = dur > 0 ? (curr / dur) * 100 : 0;
    const playedBar = document.getElementById("mobilePlayedBar");
    const thumb = document.getElementById("mobileSeekThumb");
    if (playedBar) playedBar.style.width = pct + "%";
    if (thumb) thumb.style.left = pct + "%";
  }

  // Buffer bar
  const bufferBar = document.getElementById("mobileBufferBar");
  if (bufferBar && dur > 0 && player.buffered().length > 0) {
    const bufEnd = player.buffered().end(player.buffered().length - 1);
    bufferBar.style.width = Math.min(100, (bufEnd / dur) * 100) + "%";
  }
}

// Update Volume UI
function updateVolumeUI() {
  if (!player) return;
  const isMuted = player.muted() || player.volume() === 0;
  const iconOn = document.getElementById("mMuteIconOn");
  const iconOff = document.getElementById("mMuteIconOff");
  if (iconOn && iconOff) {
    iconOn.style.display = isMuted ? "none" : "block";
    iconOff.style.display = isMuted ? "block" : "none";
  }
}

// Update Speed UI
function updateSpeedUI() {
  if (!player) return;
  const speed = player.playbackRate();
  const speedBtn = document.getElementById("mobileSpeedBtn");
  if (speedBtn) speedBtn.textContent = speed + "x";

  // Sync settings bottom sheet chips
  document.querySelectorAll("#settingsSpeedChips .setting-chip").forEach(chip => {
    chip.classList.toggle("active", parseFloat(chip.dataset.speed) === speed);
  });
}

// Bind player events
function bindMobilePlayer(p) {
  if (!p) return;
  p.on("play", () => updatePlayPauseUI(true));
  p.on("pause", () => updatePlayPauseUI(false));
  p.on("timeupdate", updateProgressUI);
  p.on("durationchange", updateProgressUI);
  p.on("loadedmetadata", () => {
    updateProgressUI();
    const vid = videoContainer.querySelector("video");
    if (vid && vid.videoWidth && vid.videoHeight) {
      const resText = `📐 ${vid.videoWidth} × ${vid.videoHeight}`;
      const resBadge = document.getElementById("mobileResBadge");
      const settingsInfo = document.getElementById("settingsResInfo");
      if (resBadge) resBadge.textContent = resText;
      if (settingsInfo) settingsInfo.textContent = `Resolution: ${vid.videoWidth} × ${vid.videoHeight}`;
    }
  });
  p.on("volumechange", updateVolumeUI);
  p.on("ratechange", updateSpeedUI);
  p.on("ended", () => updatePlayPauseUI(false));

  updatePlayPauseUI(!p.paused());
  updateProgressUI();
  updateVolumeUI();
  updateSpeedUI();
}

// Initial player bind if already created
if (player) {
  bindMobilePlayer(player);
}

// ── OSD Indicators (Brightness & Volume) ──
function showOsd(type, percent) {
  const osdEl = document.getElementById(type === "brightness" ? "osdBrightness" : "osdVolume");
  const fillEl = document.getElementById(type === "brightness" ? "osdBrightnessFill" : "osdVolumeFill");
  const textEl = document.getElementById(type === "brightness" ? "osdBrightnessText" : "osdVolumeText");
  if (!osdEl || !fillEl || !textEl) return;

  const clamped = Math.max(0, Math.min(100, percent));
  fillEl.style.height = clamped + "%";
  textEl.textContent = clamped + "%";
  osdEl.classList.add("active");

  if (osdTimeout) clearTimeout(osdTimeout);
  osdTimeout = setTimeout(() => {
    const b = document.getElementById("osdBrightness");
    const v = document.getElementById("osdVolume");
    if (b) b.classList.remove("active");
    if (v) v.classList.remove("active");
  }, 900);
}

function setBrightness(level) {
  currentBrightness = Math.max(0.2, Math.min(2.0, level));
  videoContainer.style.filter = `brightness(${currentBrightness})`;
  const pct = Math.round((currentBrightness / 2.0) * 100);
  showOsd("brightness", pct);
}

function setVolume(val) {
  if (!player) return;
  const clamped = Math.max(0, Math.min(1, val));
  player.volume(clamped);
  if (clamped > 0 && player.muted()) player.muted(false);
  showOsd("volume", Math.round(clamped * 100));
}

// ── Gesture Ripple Animation ──
function triggerRipple(side, iconText) {
  let rippleId = side === "left" ? "rippleLeft" : side === "right" ? "rippleRight" : "rippleCenter";
  const el = document.getElementById(rippleId);
  if (!el) return;

  if (side === "center" && iconText) {
    const centerIcon = document.getElementById("rippleCenterIcon");
    if (centerIcon) centerIcon.textContent = iconText;
  }

  el.classList.add("active");
  if (rippleTimeouts[side]) clearTimeout(rippleTimeouts[side]);
  rippleTimeouts[side] = setTimeout(() => {
    el.classList.remove("active");
  }, 500);
}

// ── Touch Gestures (Single/Double Tap, Swipe, Pinch) ──
const gestureArea = document.getElementById("mobileGestureArea");
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;
let singleTapTimer = null;

let touchStartX = 0;
let touchStartY = 0;
let touchStartBrightness = 1.0;
let touchStartVolume = 1.0;
let isVerticalSwiping = false;
let swipeDirection = null; // 'brightness' or 'volume'
let initialPinchDist = null;
let initialPinchZoom = 1.0;

if (gestureArea) {
  gestureArea.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      // Pinch to zoom
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialPinchZoom = zoomLevel;
      return;
    }

    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartBrightness = currentBrightness;
      touchStartVolume = player ? player.volume() : 1.0;
      isVerticalSwiping = false;
      swipeDirection = null;
    }
  }, { passive: false });

  gestureArea.addEventListener("touchmove", (e) => {
    // 2-finger pinch
    if (e.touches.length === 2 && initialPinchDist) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = dist / initialPinchDist;
      zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(initialPinchZoom * factor).toFixed(2)));
      applyZoom();
      const zoomSetting = document.getElementById("settingsZoomLabel");
      if (zoomSetting) zoomSetting.textContent = Math.round(zoomLevel * 100) + "%";
      return;
    }

    // 1-finger vertical swipe
    if (e.touches.length === 1) {
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      // In VR mode, allow looking around unless dragging near vertical screen edges
      if (isVR && Math.abs(dx) > 10) {
        return; // let VR controls look around
      }

      if (!isVerticalSwiping) {
        if (Math.abs(dy) > 16 && Math.abs(dy) > Math.abs(dx) * 1.5) {
          isVerticalSwiping = true;
          const rect = gestureArea.getBoundingClientRect();
          const relX = (touchStartX - rect.left) / rect.width;
          swipeDirection = relX < 0.5 ? "brightness" : "volume";
        }
      }

      if (isVerticalSwiping) {
        e.preventDefault();
        const delta = -dy / 200; // sensitivity
        if (swipeDirection === "brightness") {
          setBrightness(touchStartBrightness + delta);
        } else if (swipeDirection === "volume") {
          setVolume(touchStartVolume + delta);
        }
      }
    }
  }, { passive: false });

  gestureArea.addEventListener("touchend", (e) => {
    initialPinchDist = null;

    if (isVerticalSwiping) {
      isVerticalSwiping = false;
      return;
    }

    // Tap detection
    const now = Date.now();
    const touch = e.changedTouches ? e.changedTouches[0] : null;
    if (!touch) return;

    const currentX = touch.clientX;
    const currentY = touch.clientY;
    const timeDiff = now - lastTapTime;
    const distDiff = Math.hypot(currentX - lastTapX, currentY - lastTapY);

    if (timeDiff < 300 && distDiff < 35) {
      // Double tap!
      if (singleTapTimer) {
        clearTimeout(singleTapTimer);
        singleTapTimer = null;
      }

      const rect = gestureArea.getBoundingClientRect();
      const relX = (currentX - rect.left) / rect.width;

      if (relX < 0.35) {
        // Double tap left: -10s
        if (player) {
          player.currentTime(Math.max(0, player.currentTime() - 10));
          triggerRipple("left");
        }
      } else if (relX > 0.65) {
        // Double tap right: +10s
        if (player) {
          player.currentTime(Math.min(player.duration() || 0, player.currentTime() + 10));
          triggerRipple("right");
        }
      } else {
        // Double tap center: Play/Pause toggle
        if (player) {
          if (player.paused()) {
            player.play().catch(() => {});
            triggerRipple("center", "▶");
          } else {
            player.pause();
            triggerRipple("center", "⏸");
          }
        }
      }

      lastTapTime = 0; // reset
    } else {
      // Single tap candidate
      lastTapTime = now;
      lastTapX = currentX;
      lastTapY = currentY;

      singleTapTimer = setTimeout(() => {
        toggleMobileControls();
        singleTapTimer = null;
      }, 260);
    }
  });

  // Support mouse click for desktop testing
  gestureArea.addEventListener("click", () => {
    if (Date.now() - lastTapTime > 600) {
      toggleMobileControls();
    }
  });
}

// ── Touch Progress Bar Scrubbing ──
const progressContainer = document.getElementById("mobileProgressBarContainer");
const playedBarEl = document.getElementById("mobilePlayedBar");
const thumbEl = document.getElementById("mobileSeekThumb");
const tooltipEl = document.getElementById("mobileSeekTooltip");

function handleSeekInput(clientX) {
  if (!progressContainer || !player) return 0;
  const rect = progressContainer.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const dur = player.duration() || 0;
  const scrubTime = pct * dur;

  if (playedBarEl) playedBarEl.style.width = (pct * 100) + "%";
  if (thumbEl) thumbEl.style.left = (pct * 100) + "%";

  if (tooltipEl) {
    tooltipEl.textContent = formatTime(scrubTime);
    tooltipEl.style.left = (pct * 100) + "%";
    tooltipEl.style.display = "block";
  }

  return scrubTime;
}

if (progressContainer) {
  progressContainer.addEventListener("touchstart", (e) => {
    isScrubbing = true;
    progressContainer.classList.add("scrubbing");
    resetMobileControlsTimeout();
    handleSeekInput(e.touches[0].clientX);
  }, { passive: true });

  progressContainer.addEventListener("touchmove", (e) => {
    if (!isScrubbing) return;
    resetMobileControlsTimeout();
    handleSeekInput(e.touches[0].clientX);
  }, { passive: true });

  progressContainer.addEventListener("touchend", (e) => {
    if (!isScrubbing) return;
    isScrubbing = false;
    progressContainer.classList.remove("scrubbing");
    if (tooltipEl) tooltipEl.style.display = "none";
    const touch = e.changedTouches ? e.changedTouches[0] : null;
    if (touch && player && player.duration()) {
      const scrubTime = handleSeekInput(touch.clientX);
      player.currentTime(scrubTime);
    }
    resetMobileControlsTimeout();
  });

  // Mouse drag support for desktop
  progressContainer.addEventListener("mousedown", (e) => {
    isScrubbing = true;
    progressContainer.classList.add("scrubbing");
    handleSeekInput(e.clientX);

    const onMouseMove = (me) => {
      if (isScrubbing) handleSeekInput(me.clientX);
    };

    const onMouseUp = (ue) => {
      isScrubbing = false;
      progressContainer.classList.remove("scrubbing");
      if (tooltipEl) tooltipEl.style.display = "none";
      if (player && player.duration()) {
        const scrubTime = handleSeekInput(ue.clientX);
        player.currentTime(scrubTime);
      }
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
      resetMobileControlsTimeout();
    };

    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
  });
}

    if (!vid) return;
    try {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else if (vid.requestPictureInPicture) {
        await vid.requestPictureInPicture();
      } else if (vid.webkitSetPresentationMode) {
        vid.webkitSetPresentationMode(
          vid.webkitPresentationMode === "picture-in-picture" ? "inline" : "picture-in-picture"
        );
      }
    } catch (err) {
      console.warn("PiP not available:", err);
    }
  });
}

// Fullscreen
const mobileFullscreenBtn = document.getElementById("mobileFullscreenBtn");
function toggleMobileFullscreen() {
  const target = document.getElementById("playerWrapper") || videoContainer;
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!isFs) {
    if (target.requestFullscreen) {
      target.requestFullscreen().catch(() => {
        const vid = videoContainer.querySelector("video");
        if (vid && vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
      });
    } else if (target.webkitRequestFullscreen) {
      target.webkitRequestFullscreen();
    } else {
      const vid = videoContainer.querySelector("video");
      if (vid && vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}

    enterIcon.style.display = isFs ? "none" : "block";
